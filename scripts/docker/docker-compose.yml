# Convenience wrapper around the `docker run` commands documented in
# docker_install.md. Run from the repository root, e.g.:
#   docker compose -f scripts/docker/docker-compose.yml run --rm vivado
#   docker compose -f scripts/docker/docker-compose.yml run --rm petalinux
#   docker compose -f scripts/docker/docker-compose.yml run --rm cocotb
#
# This assumes the `vivado-tools` and `petalinux-tools` volumes already
# exist and have been populated (see scripts/docker/install-vivado.sh and
# scripts/docker/install-petalinux.sh) and that this file lives at
# zynq_toolbox/scripts/docker/docker-compose.yml, so `../` refers to the repo root.
#
# These are also invoked directly by the top-level Makefile when
# MODE=container -- you generally won't need to run them by hand except for
# interactive debugging inside a given tool's container.

services:
  vivado:
    build:
      context: .
      dockerfile: vivado.Dockerfile
      args:
        BUILD_UID: ${BUILD_UID:-1000}
        BUILD_GID: ${BUILD_GID:-1000}
    image: zynq-toolbox-vivado:2024.2
    # vivado-isolated has outbound NAT disabled: Vivado still cannot reach the
    # internet (no license/WebTalk fetches), but the GUI's VNC ports can be
    # published. Ports only bind when a command passes `--service-ports`
    # (open_gui.sh does; batch builds do not), on 127.0.0.1 only.
    networks:
      - vivado-isolated
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${VNC_PORT:-5901}:5901"
    working_dir: /workspace/zynq_toolbox
    volumes:
      - vivado-tools:/tools/Xilinx:ro
      - ../../:/workspace/zynq_toolbox
    stdin_open: true
    tty: true

  petalinux:
    build:
      context: .
      dockerfile: petalinux.Dockerfile
      args:
        BUILD_UID: ${BUILD_UID:-1000}
        BUILD_GID: ${BUILD_GID:-1000}
    image: zynq-toolbox-petalinux:2024.2
    working_dir: /workspace/zynq_toolbox
    volumes:
      - petalinux-tools:/tools/Xilinx:ro
      - petalinux-offline-cache:/workspace/petalinux_cache:ro
      - ../../:/workspace/zynq_toolbox
    environment:
      - PETALINUX_DOWNLOADS_PATH
      - PETALINUX_SSTATE_PATH
    stdin_open: true
    tty: true

  cocotb:
    build:
      context: .
      dockerfile: cocotb.Dockerfile
      args:
        BUILD_UID: ${BUILD_UID:-1000}
        BUILD_GID: ${BUILD_GID:-1000}
    image: zynq-toolbox-cocotb:latest
    network_mode: none
    working_dir: /workspace/zynq_toolbox
    volumes:
      - ../../:/workspace/zynq_toolbox
    stdin_open: true
    tty: true

volumes:
  vivado-tools:
    external: true
  petalinux-tools:
    external: true
  petalinux-offline-cache:
    external: true

networks:
  # Bridge with outbound NAT disabled: the container has no working route to the
  # internet (blocks Vivado license/WebTalk fetches), but published ports still
  # work -- unlike `internal: true`, which also blocks port publishing.
  vivado-isolated:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

